# Agendamento em "produção" sem servidor próprio.
#
# As datas de divulgação do IPCA não seguem um padrão fixo de cron (variam
# entre os dias ~5 e ~13 de cada mês). Em vez de tentar acertar o dia exato,
# este workflow roda TODO DIA nessa janela, às 9h01 BRT (12:01 UTC), e o
# script verificar_divulgacao_ipca.py decide — contra o calendário oficial
# do IBGE — se é para valer ou não. Na maioria dos dias, ele apenas verifica
# e não faz mais nada.
#
# Quando é dia de divulgação: roda o pipeline completo e commita PDF, PNG
# (gráfico), .txt e .html em saidas/ (normalmente ignorados pelo .gitignore
# — forçado aqui de propósito) para que outras automações (ex.: envio de
# e-mail) consigam detectar que saiu relatório novo hoje, sem precisar bater
# nas APIs do BC/IBGE de novo. O .html (com o gráfico referenciado por URL
# raw.githubusercontent.com, não embutido) vai no corpo do e-mail — nada de
# anexo binário, que trava a ferramenta de e-mail conectada.
name: monitor-inflacao

on:
  schedule:
    - cron: "1 12 5-13 * *"   # todo dia, do dia 5 ao 13 de cada mês, 12:01 UTC
  workflow_dispatch: {}       # permite rodar manualmente pelo botão

permissions:
  contents: write   # necessário para commitar o PDF de volta no repositório

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Checar se hoje é dia de divulgação do IPCA
        id: divulgacao
        run: python verificar_divulgacao_ipca.py
        continue-on-error: true

      - name: Rodar pipeline
        if: steps.divulgacao.outcome == 'success'
        run: python orquestrador.py

      - name: Publicar relatório (artefato do run)
        if: steps.divulgacao.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-ipca
          path: |
            saidas/*.pdf
            saidas/*.png
            saidas/*.txt
            saidas/*.html

      - name: Commitar relatório no repositório
        if: steps.divulgacao.outcome == 'success'
        run: |
          git config user.name "agente-inflacao-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f saidas/*.pdf saidas/*.png saidas/*.txt saidas/*.html
          git commit -m "Relatório automático: $(date -u +%Y-%m-%d)" || echo "Nada para commitar"
          git push
