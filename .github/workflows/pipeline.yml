# Agendamento em "produção" sem servidor próprio.
# Roda o pipeline toda manhã (07:00 BRT = 10:00 UTC) e guarda o PDF como
# artefato do run. Para enviar por e-mail/Slack, acrescente um passo no fim.
name: monitor-inflacao

on:
  schedule:
    - cron: "0 10 * * 1-5"   # seg-sex, 10:00 UTC
  workflow_dispatch: {}       # permite rodar manualmente pelo botão

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        run: python orquestrador.py

      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-ipca
          path: saidas/*.pdf
