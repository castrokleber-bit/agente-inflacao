# Agendamento em "produção" sem servidor próprio — boletim do IPCA cheio.
#
# As datas de divulgação do IPCA não seguem um padrão fixo de cron (variam
# entre os dias ~5 e ~13 de cada mês). Em vez de tentar acertar o dia exato,
# este workflow roda TODO DIA nessa janela e o script
# verificar_divulgacao_ipca.py decide — contra o calendário oficial do
# IBGE — se é para valer ou não. Na maioria dos dias, ele apenas verifica
# e não faz mais nada.
#
# Roda uma vez, às 12h BRT: o IPCA sai às 9h, mas os núcleos de inflação
# costumam ser publicados pelo BC um pouco depois; rodar ao meio-dia
# garante o núcleo já atualizado.
#
# Minuto "quebrado" (07) de propósito: o GitHub atrasa mais os cron agendados
# em hora cheia. Mesmo assim o GitHub NÃO garante o horário — em 2026-09 os
# disparos chegaram com 3-4h de atraso. Por isso o e-mail NÃO é agendado por
# horário: o último passo publica um *release* no GitHub, e é esse evento
# que dispara a rotina do Claude que envia o e-mail (ver CLAUDE.md).
#
# Quando é dia de divulgação: roda o pipeline completo e commita PDF, PNG
# (gráfico), .txt e .html em saidas/ (normalmente ignorados pelo .gitignore
# — forçado aqui de propósito) para que a rotina de e-mail leia o relatório
# sem precisar bater nas APIs do BC/IBGE de novo. O .html vai no corpo do
# e-mail — nada de anexo binário, que trava a ferramenta de e-mail conectada.
name: monitor-inflacao

on:
  schedule:
    - cron: "7 15 5-13 * *"   # todo dia, do dia 5 ao 13, 12h07 BRT (15:07 UTC)
  workflow_dispatch: {}

permissions:
  contents: write   # necessário para commitar o relatório e publicar o release

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Checar se hoje é dia de divulgação do IPCA
        id: divulgacao
        run: python verificar_divulgacao_ipca.py
        continue-on-error: true

      - name: Rodar pipeline
        if: steps.divulgacao.outcome == 'success'
        run: python orquestrador.py

      - name: Publicar relatório (artefato do run)
        if: steps.divulgacao.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-ipca
          path: |
            saidas/*.pdf
            saidas/*.png
            saidas/*.txt
            saidas/*.html

      - name: Commitar relatório no repositório
        id: commit
        if: steps.divulgacao.outcome == 'success'
        run: |
          git config user.name "agente-inflacao-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f saidas/*.pdf saidas/*.png saidas/*.txt saidas/*.html
          if git diff --cached --quiet; then
            echo "Nada para commitar"
            echo "publicado=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Relatório automático (IPCA): $(date -u +%Y-%m-%d)"
            git push
            echo "publicado=true" >> "$GITHUB_OUTPUT"
          fi

      # Este release é o GATILHO do e-mail: a rotina do Claude escuta o evento
      # "release publicado" deste repositório. Tag com a data do dia — se o
      # workflow for rodado de novo no mesmo dia, o release já existe e não é
      # recriado (evita e-mail duplicado).
      - name: Publicar release (dispara o envio do e-mail)
        if: steps.commit.outputs.publicado == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ipca-$(date -u +%Y-%m-%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG já existe — não recriado (e-mail não é reenviado)."
          else
            gh release create "$TAG" --target main \
              --title "Monitor de Inflação — IPCA — $(date -u +%d/%m/%Y)" \
              --notes "Relatório automático do IPCA publicado em saidas/."
          fi
